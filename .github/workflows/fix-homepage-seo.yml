name: Fix homepage SEO URLs

on:
  push:
    paths:
      - '.github/workflows/fix-homepage-seo.yml'

permissions:
  contents: write

jobs:
  fix-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update homepage SEO URLs only
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          head, marker, body = text.partition("</head>")
          if not marker:
              raise SystemExit("Could not find </head> in index.html")

          old = "https://www.hasibabir.us"
          new = "https://profile.hasibabir.us"
          updated_head = head.replace(old, new)

          if updated_head == head:
              print("No homepage SEO URL replacements were needed.")
          else:
              path.write_text(updated_head + marker + body, encoding="utf-8")
              print("Homepage SEO URLs updated. Body content was not modified.")

      - name: Commit homepage SEO fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix homepage SEO URLs for profile subdomain"
          git push
