name: SEO portrait preference update

on:
  push:
    paths:
      - '.github/workflows/seo-portrait-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage portrait SEO signals
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<meta property="og:image" content="https://profile.hasibabir.us/assets/img/hero-bg.jpg">': '<meta property="og:image" content="https://profile.hasibabir.us/assets/img/my-profile-img.jpg">',
            '<meta property="og:image:width" content="1536">': '<meta property="og:image:width" content="600">',
            '<meta property="og:image:height" content="1024">': '<meta property="og:image:height" content="600">',
            '<meta property="og:image:alt" content="Hasib Abir, Dubai-based IT freelancer and web designer">': '<meta property="og:image:alt" content="Portrait of Hasib Abir, Dubai-based System Analyst and IT freelancer">',
            '<meta property="profile:username" content="mchasib">\n': '',
            '<meta name="twitter:image" content="https://profile.hasibabir.us/assets/img/hero-bg.jpg">': '<meta name="twitter:image" content="https://profile.hasibabir.us/assets/img/my-profile-img.jpg">',
            '<meta name="twitter:image:alt" content="Hasib Abir, Dubai-based IT freelancer and web designer">': '<meta name="twitter:image:alt" content="Portrait of Hasib Abir, Dubai-based System Analyst and IT freelancer">',
            '"image": "https://profile.hasibabir.us/assets/img/my-profile-img.jpg",': '"image": {\n        "@type": "ImageObject",\n        "url": "https://profile.hasibabir.us/assets/img/my-profile-img.jpg",\n        "contentUrl": "https://profile.hasibabir.us/assets/img/my-profile-img.jpg",\n        "caption": "Hasib Abir",\n        "width": 600,\n        "height": 600\n      },',
            '"mainEntity": {\n        "@id": "https://profile.hasibabir.us/#person"\n      },': '"mainEntity": {\n        "@id": "https://profile.hasibabir.us/#person"\n      },\n      "primaryImageOfPage": {\n        "@type": "ImageObject",\n        "url": "https://profile.hasibabir.us/assets/img/my-profile-img.jpg",\n        "contentUrl": "https://profile.hasibabir.us/assets/img/my-profile-img.jpg",\n        "caption": "Hasib Abir",\n        "width": 600,\n        "height": 600\n      },'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old[:90]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prioritize Hasib Abir portrait in homepage SEO metadata"
          git push
